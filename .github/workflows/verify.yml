# WHAT RUNS WITHOUT SOMEBODY REMEMBERING TO RUN IT.
#
# Until this file existed, nothing did. There was no .github/workflows at
# all, and the only automatic guard in the repository was a pre-commit
# hook installed by `npm install` that checks for mutation markers and
# nothing else. `npm run build` — the command Vercel runs — used to cover
# the function limits, the marker check, the i18n check, the unit suite
# and `next build`. Since 2026-09-27 it builds and nothing more: the
# checks are `npm run gates`, a step of their own below. It does NOT run
# the mutation suites, the integration suites, the database suites or
# the production browser tests.
#
# THE COST OF THAT WAS MEASURED, not imagined. Commit d2c4d81 (2026-08-27)
# correctly fixed a "NaN credits/month" bug by removing formatNumber()
# from eight components — two of which were quoted verbatim as mutation
# anchors in scripts/tests/voice.mutation.mjs. The anchors went stale, the
# mutations stopped applying, and `npm run test:mutation` was red for two
# days and twenty-seven commits before anybody ran it. Nobody was at
# fault: the command that would have said so was not run by anything.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # THE NIGHTLY TRIGGER FOR THE prodtests JOB BELOW. Without this line
  # that job's `if:` names an event this workflow never receives, so it
  # would have sat in the file looking like coverage and running never.
  schedule:
    - cron: "0 3 * * *"
  # THE DEPLOY ITSELF, which is the event the owner actually cares about.
  # GitHub emits deployment_status when Vercel reports one; the payload
  # carries environment_url, so the bot is driven at the EXACT deployment
  # that just went live rather than at a URL written down here and
  # therefore able to go stale. The job below filters to a successful
  # production deployment; previews fire this too and must not spend
  # credits.
  deployment_status:

# WHO FINDS OUT WHEN IT GOES RED.
#
# THE COST OF NOBODY FINDING OUT, measured on this repository: thirty push
# runs, thirteen failures, and the same step failing in every one of them
# — `mutation suites` — for twenty commits before anyone read the history.
# A CI nobody looks at is the same as a CI that does not exist, and GitHub
# emails the person who pushed, which on a branch pushed by automation is
# nobody.
#
# So a failure on the default branch, or on any branch, opens an ISSUE.
# An issue is the one channel that is visible without a subscription,
# survives the tab being closed, and can be assigned. The job below is
# gated on failure() and de-duplicates: one open issue at a time, updated
# with each new failure rather than a new issue per push.
permissions:
  contents: read
  issues: write

concurrency:
  # A second push to the same branch cancels the first: the answer that
  # matters is the one about the current head.
  #
  # THE EVENT NAME IS PART OF THE GROUP, AND IT WAS NOT UNTIL 2026-10-16.
  # `github.ref` is the branch for a push, `refs/pull/N/merge` for a
  # pull_request — and for a deployment_status it is neither: Vercel
  # reports a deployment and the ref GitHub hands this workflow is the
  # same one for EVERY branch. So one branch's preview deployment
  # cancelled another branch's checks. It was watched happening: the
  # vision branch's deployment_status run at 07:07 cancelled the sidebar
  # branch's run (38853807995), which had been re-run deliberately, and
  # that pull request then showed a cancelled check nobody could explain
  # from its own diff.
  #
  # With the event name in the group a deployment_status run can only
  # cancel another deployment_status run, which is the behaviour the
  # sentence above describes and the only one anybody wants.
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build · mutations · database
    # NOT ON A DEPLOYMENT REPORT. `deployment_status` is here for
    # bot-on-deploy below — Vercel emits one per deployment, several per
    # deployment in fact (queued, building, ready). Without this line
    # every one of them started this hour-long job again on bytes that
    # had already been checked by the push and the pull_request, which is
    # the same answer paid for three times.
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    # THE MUTATION SUITES ARE MOST OF THIS JOB. Measured on 2026-10-03:
    # 201 suites took 38.5 minutes (run of 30908b2d) and 204 took more than
    # 53 on a slower runner (run of 3cee7809, every suite 1.3-1.5x slower),
    # which hit the old 60-minute cap with ten suites, the database suites
    # and the integration suites still to run — cancelled, not failed, so
    # nothing said which. `node scripts/tests/run-mutations.mjs` prints
    # each suite's time. The default six-hour cap is not a limit, it is an
    # absence of one; this is set to something a stuck run will still hit.
    # RAISED 2026-10-09, the job 100 -> 140 and its mutation step 75 -> 120:
    # 260 suites took 71 and 72 minutes (jobs 113702994392, 113702975312),
    # 262 took 59 and 74 (jobs 113716369257, 113716145720), and a third run
    # of those 262, on the same commit, was cut at 75 with every suite it
    # had reached green (job 113716293180). The step's 75 was set on
    # 2026-10-04, when it took 56 (scripts/tests/ci-step-timeouts.test.mjs).
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm

      # FAST, AND ON EVERY PUSH (owner, Βήμα 2 — CI for a private
      # repository, 2026-10-05): scripts/security/push-secret-scan.mjs
      # diffs only the lines THIS push adds against the event's own base
      # — seconds, not the minutes scripts/security/git-history-keys.mjs
      # needs to walk all of history. SCAN_BASE is empty for schedule and
      # workflow_dispatch and for a brand-new branch's first push
      # (`before` is the all-zero SHA); the script's own fallback is a
      # diff against git's empty-tree hash, which reads the WHOLE current
      # tree as "added" rather than skipping — slower-safe, not silent.
      - name: secret scan (this push's diff)
        timeout-minutes: 5
        env:
          SCAN_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$SCAN_BASE" ]; then
            git fetch --no-tags --depth=50 origin "$SCAN_BASE" 2>/dev/null || true
          fi
          node scripts/security/push-secret-scan.mjs

      # `npm ci`, not `npm install`: the lockfile is the input, and a
      # resolution that drifts silently in CI is a build that does not
      # describe the commit.
      - name: install
        timeout-minutes: 10
        run: npm ci

      # ALSO FAST, ALSO EVERY PUSH. `--omit=dev` because a vulnerable
      # devDependency cannot reach production; `--audit-level=high`
      # because npm audit's own "moderate" bar includes advisories this
      # repository cannot act on today (a transitive tool with no fix
      # available) — the owner asked for a check that gates, not one that
      # reports and is learned to ignore.
      - name: dependency audit
        timeout-minutes: 10
        run: npm audit --omit=dev --audit-level=high

      - name: typecheck
        timeout-minutes: 10
        run: npx tsc --noEmit

      - name: lint
        timeout-minutes: 10
        run: npx eslint

      # THE GATES MOVED OUT OF `npm run build` ON 2026-09-27, and this
      # step is where they went.
      #
      # `npm run build` is the command Vercel runs, and it ran the
      # function limits, the marker check, the mutation-tree check, the
      # i18n check and all 294 unit gates before it compiled anything.
      # Two consequences, and the second is the one that cost a week:
      # every deploy paid for the whole suite, and a gate that fails on
      # the builder fails the DEPLOY — so a check about this repository's
      # own conventions could take production down. A build should
      # build.
      #
      # Nothing is lost by moving them here, and that is the whole
      # argument for it being safe: this job runs on every push to every
      # branch, and scripts/tests/ci-coverage.test.mjs fails the build if
      # a suite family is named by no job in this file.
      - name: gates (everything the build used to run before it compiled)
        timeout-minutes: 20
        run: npm run gates

      # NO env vars are supplied on purpose: the build must not need
      # secrets to compile. This is now `apply-function-limits` — which
      # REWRITES route files and is therefore part of building — and
      # `next build`, and nothing else.
      - name: build (no env vars — a clean-clone build must not need any)
        timeout-minutes: 15
        run: npm run build

      # THE ONE THIS FILE WAS WRITTEN FOR.
      # POSTGRES BEFORE THE MUTATION SUITES, not after them.
      #
      # It used to be installed in the step below the mutation run, on the
      # reasonable-looking argument that only the database suites need it.
      # They are not the only ones: ai-memory.mutation.mjs drives
      # chat-memory-store.itest.mjs, which starts an ephemeral cluster with
      # initdb — and with no initdb on PATH that gate is RED on the
      # unmutated tree, so the whole suite reports "BASELINE IS RED" and
      # kills nothing. It had been doing that on main while the build
      # stayed green, because the mutation suites are not part of
      # `npm run gates`.
      #
      # Installing it earlier costs the same minute and removes a whole
      # class of suite that cannot run where it is asked to.
      #
      # EVERYTHING FROM HERE DOWN IS THE "HEAVY" HALF (owner, Βήμα 2 —
      # CI for a private repository, 2026-10-05: "τα μεγάλα... περνάνε σε
      # pre-merge και νυχτερινό μόνο"). A measurement by hand on
      # 2026-10-21 (docs/PROGRESS.md) found this job running three times
      # on identical bytes for one push — once for the push itself, once
      # for the pull_request, once more per deployment report — at
      # 62-94 minutes each, which is most of why a private repo's 2,000
      # free minutes/month were already being spent at roughly 14x. The
      # six steps below are the expensive ones (postgres, both suite
      # runs, the browser install, the integration suites), so a plain
      # push to a feature branch now skips them and keeps only
      # typecheck/lint/gates/build/audit/secret-scan above. NOTHING IS
      # LOST: every commit still gets them, either through the
      # pull_request run while it is in review or through this same push
      # event when the ref IS main — which is the one push a feature
      # branch's pushes are not.
      - name: postgres, for the suites that need one
        if: >-
          github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: mutation suites
        if: >-
          github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 120
        run: npm run test:mutation

      # A mutation suite that dies part-way leaves its edit in the working
      # tree — it restores in a `finally`, but a hard kill has no finally.
      # A green run that left the tree dirty is not a green run, and the
      # next step would otherwise inherit somebody else's mutant.
      - name: the mutation suites put the tree back
        if: >-
          github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a mutation suite left the working tree modified"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "working tree clean"

      # scripts/db/run-dbtests.mjs provisions a throwaway PostgreSQL with
      # initdb, applies bootstrap-supabase.sql and every migration in
      # order, and runs the suites against it — no secrets needed.

      # ITS EXIT CODE CANNOT TELL YOU IT RAN. run-dbtests.mjs exits 0 when
      # no Postgres is reachable — deliberately, and its own header says
      # so in as many words: "nothing here distinguishes skipped from
      # passed AT THE EXIT CODE". In CI that is the difference between a
      # gate and a green tick, so the log is read for the skip it prints.
      - name: database suites
        if: >-
          github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee /tmp/dbtests.log
          if grep -q "SKIPPED" /tmp/dbtests.log; then
            echo "::error::test:db skipped — it exits 0 when no Postgres is reachable, so this would have been a false green"
            exit 1
          fi

      # THE FAMILY THAT WAS IN NO JOB AT ALL. scripts/tests/*.itest.mjs
      # existed, package.json had a script for it, and this file never
      # named either — so the integration suites had the same coverage as
      # the browser tests, which is to say none. Found by
      # scripts/tests/ci-coverage.test.mjs, which now asserts that every
      # family of suite in scripts/tests/ is run by some job here.
      #
      # After the database step because several of them want its Postgres.
      # A BROWSER FOR THE ONE INTEGRATION SUITE THAT OPENS ONE.
      # offline-shell-language.itest.mjs builds the app and loads the
      # offline page in Chromium. The browser was installed only in the
      # smoke job, so the first time this step was reached (run of
      # df83449e, 2026-10-03 — every earlier run stopped before it) it died
      # on "Executable doesn't exist". Same install as the smoke job.
      - name: chromium, for the integration suite that needs one
        if: >-
          github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: integration suites
        if: >-
          github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: npm run test:integration

  # ONE BROWSER TEST ON EVERY PUSH, and the rest nightly.
  #
  # THE GAP THIS CLOSES, measured. The nightly job below has an `if:` that
  # names `schedule` and `workflow_dispatch`, so on a push it is SKIPPED —
  # and the run history for this repository contains thirty push runs and
  # zero schedule runs. The browser tests had therefore never executed in
  # CI at all. What that cost was found by running one by hand:
  # routes-smoke.prodtest.mjs was CRASHING at its fifth section, and eight
  # of its assertions still named sidebar groups and page titles from
  # before the V4.6 #3 consolidation. A suite nothing runs stops being a
  # suite and becomes a file.
  #
  # routes-smoke is the one that runs on every push because it has the
  # broadest reach per build: eight public and thirty-one signed-in
  # routes, each at four widths, checking status, console errors,
  # unresolved i18n keys, horizontal overflow and touch targets — about
  # five hundred assertions for a single `next build`.
  prodtest-smoke:
    name: browser smoke (every push)
    # Same reason as verify above: its name says "every push", and a
    # deployment report is not one.
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    # One `next build` plus thirty-nine routes at four widths. If it has
    # not finished in twenty-five minutes something is wedged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - name: chromium
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      # It stands up its own stand-in Supabase on 127.0.0.1 and builds
      # against it, so no secret and no live project are involved.
      - name: routes-smoke
        timeout-minutes: 18
        run: node scripts/tests/routes-smoke.prodtest.mjs

  # THE REST OF THE BROWSER TESTS ARE NIGHTLY, and the reason is
  # arithmetic rather than judgement: each of the *.prodtest.mjs files
  # runs its own `next build` before it opens a browser, so the whole set
  # takes well over an hour. Blocking every push on all of them would
  # teach people to skip CI.
  #
  # THE COUNT IS NOT WRITTEN HERE ON PURPOSE. It used to be spelled out in
  # words in this comment, the number was wrong by six, and nothing
  # noticed — a number in a comment is a number nothing checks.
  # scripts/tests/ci-coverage.test.mjs asserts instead that every suite
  # family in scripts/tests/ is named by some job in this file.
  prodtests:
    name: production browser tests (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      # Every prodtest reads CHROMIUM_PATH before falling back to the
      # image-local path this repo's own sandbox uses — held by
      # scripts/tests/portable-paths.test.mjs section 3, which until
      # 2026-10-14 accepted the word `executablePath` as proof of that and
      # so could not go red. Three prodtests were not reading it: two
      # threw here and, because test:prod stops at the first failure, took
      # the other 63 files with them (issue #280); the third skipped its
      # browser section and reported green.
      - name: chromium
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      # THE OTHER PROGRAMS THAT OPEN A POWERPOINT AND A WORD FILE.
      # slides-charts.prodtest.mjs hands the .pptx Slides downloads to
      # LibreOffice Impress and reads the chart back from what Impress
      # wrote; document-writer.prodtest.mjs does the same with the .docx and
      # Writer. Without them those tests fail rather than passing unopened.
      - name: libreoffice impress and writer
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-impress libreoffice-writer
      - name: production browser tests
        timeout-minutes: 160
        run: npm run test:prod

  # ---------------------------------------------------------------------
  # BRANCHES NOBODY IS LOOKING AT.
  #
  # Eighty-nine commits across eight branches sat unmerged for weeks,
  # two of them carrying whole user-facing pages that exist on main in
  # no form. They were not rejected, they were forgotten — so the fix is
  # not a better decision, it is something that says they are there.
  #
  # Weekly, not per-push: a branch is not a defect and a message on every
  # commit is a message nobody reads. Opens ONE issue and comments on it
  # thereafter, the same de-duplication the red-CI alert uses.
  unmerged-branches:
    name: branches carrying work that is not on main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
      - name: look
        timeout-minutes: 5
        id: look
        run: |
          node scripts/unmerged-branches.mjs --write > /dev/null || true
          {
            echo 'report<<REPORT_EOF'
            cat docs/unmerged-branches.md
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
          node scripts/unmerged-branches.mjs --json > /tmp/b.json
          echo "routes=$(node -e 'const r=require("/tmp/b.json");console.log(r.filter(x=>x.routes>0).length)')" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        timeout-minutes: 5
        if: steps.look.outputs.routes != '0'
        with:
          script: |
            const title = "Branches carrying work that is not on main";
            // NOT WRAPPED IN A TEMPLATE LITERAL, and that single pair of
            // backticks cost this job every run since the report first
            // contained a code span. toJSON() emits a JSON string —
            // quotes included — and JSON string syntax is a subset of
            // JavaScript's, so it IS the literal and needs no quoting.
            // Wrapping it in backticks meant the first ` inside the
            // markdown ended the template, and the job died with
            // `SyntaxError: Unexpected identifier 'node'` — the word
            // after the backtick in "`node scripts/unmerged-branches.mjs`".
            const body = ${{ toJSON(steps.look.outputs.report) }};
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "unmerged-work", per_page: 10,
            })).data.find((i) => i.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["unmerged-work"],
              });
            }

  # ---------------------------------------------------------------------
  # THE 80%-OF-QUOTA ALERT (owner, Βήμα 2 — CI for a private repository,
  # 2026-10-05: "80%-of-quota alert to the owner"). A private repository's
  # Actions minutes are capped and billed; a measurement by hand on
  # 2026-10-21 (docs/PROGRESS.md) found roughly 14x the free 2,000/month
  # quota already spent. Nightly, like unmerged-branches above: usage
  # does not move fast enough to need checking on every push, and
  # checking it on every push would itself spend the minutes it exists
  # to watch.
  #
  # NO REPOSITORY TOKEN CAN READ THIS. GITHUB_TOKEN is scoped to the repo;
  # GitHub's billing endpoints take a personal access token belonging to
  # the ACCOUNT, full stop — scripts/ci/quota-alert.mjs's own header says
  # so. ACTIONS_BILLING_PAT is that token, a secret the owner adds once.
  #
  # A MISSING SECRET FAILS LOUDLY, the same choice bot-on-deploy made
  # below for BOT_EMAIL/BOT_PASSWORD: this job is schedule-only, so a
  # missing secret costs one red item in the existing ci-red issue, never
  # a blocked push or deploy — and a quiet skip would read as "usage is
  # fine" when nothing was measured.
  quota-alert:
    name: GitHub Actions usage vs. the free quota (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
      - name: measure usage against the free quota
        timeout-minutes: 5
        env:
          ACTIONS_BILLING_PAT: ${{ secrets.ACTIONS_BILLING_PAT }}
        run: node scripts/ci/quota-alert.mjs

  # ---------------------------------------------------------------------
  # THE PRODUCT, TRIED ON THE THING THAT JUST SHIPPED.
  #
  # Every other job in this file reads the repository. This one signs in
  # to the deployment and uses it: writes a brief into the Website
  # Builder, into Presentations, into Posts, and reports what came back.
  # It exists because ten rounds of "the gates are green" sat beside a
  # production nobody had opened, and no gate could tell the difference.
  #
  # IT SPENDS REAL CREDITS, so it is fenced three ways: only on a
  # SUCCESSFUL PRODUCTION deployment (previews fire this event too),
  # never on a push, and BOT_COST_LIMIT caps the billable checks at four.
  # A harness that can empty the account overnight is a bug.
  #
  # IT IS DRIVEN AT environment_url, the deployment's own address from
  # the event payload — not a URL written in this file, which is how a
  # bot ends up testing a deployment from last month and calling it
  # production.
  #
  # AND IT ASKS THAT DEPLOYMENT WHETHER IT CAN GENERATE before it spends
  # anything: scripts/lib/bot-preflight.mjs reads /api/health's `ai`
  # field, and a target with no provider key makes every billable check
  # NOT RUN rather than BROKEN. A product is not broken for being absent
  # from the environment somebody aimed a harness at.
  bot-on-deploy:
    name: the bot signs in and tries the product (every production deploy)
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # WHICH DEPLOYMENT IS THIS, SAID OUT LOUD.
      #
      # The environment filter used to sit in the job's `if:`, and a job
      # that does not match one is `skipped` — a grey tick with no
      # reason attached. Two of those went past on 2026-09-28 and the
      # only way to know WHY was to reason about a payload nobody can
      # see. That is the shape this repository keeps finding: a check
      # that declines to run and says nothing about it.
      #
      # So the filter moved into a step that prints what it saw. Every
      # deployment_status run now states the environment and the URL in
      # its own summary, and the preview runs — which must not spend
      # credits — say so in one line instead of being invisible.
      #
      # CASE-INSENSITIVE, because the exact string is Vercel's to choose
      # and a filter that depends on its capitalisation is a filter that
      # silently stops working when they change it.
      - name: which deployment is this
        timeout-minutes: 5
        id: which
        run: |
          env_name="${{ github.event.deployment_status.environment }}"
          url="${{ github.event.deployment_status.environment_url }}"
          lower=$(printf '%s' "$env_name" | tr '[:upper:]' '[:lower:]')
          case "$lower" in
            production|prod) is_prod=true ;;
            *) is_prod=false ;;
          esac
          echo "is_production=$is_prod" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment seen"
            echo ""
            echo "- environment: \`$env_name\`"
            echo "- url: $url"
            echo "- the bot runs here: **$is_prod**"
            if [ "$is_prod" != "true" ]; then
              echo ""
              echo "A preview deployment spends no credits. This is not a result about the product."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        timeout-minutes: 5
        if: steps.which.outputs.is_production == 'true'
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        if: steps.which.outputs.is_production == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        timeout-minutes: 10
        if: steps.which.outputs.is_production == 'true'
      - name: chromium
        timeout-minutes: 10
        if: steps.which.outputs.is_production == 'true'
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      # THE CREDENTIALS ARE A REPOSITORY SECRET AND NOTHING ELSE. Never
      # the owner's own account: this thing deletes what it creates.
      #
      # A MISSING SECRET FAILS LOUDLY. The alternative — skipping the job
      # when the secret is empty — produces a green tick on a deployment
      # nobody tried, which is the exact shape this whole file exists to
      # refuse. Red until the secrets are set is the honest state.
      - name: the credentials exist
        timeout-minutes: 2
        if: steps.which.outputs.is_production == 'true'
        run: |
          if [ -z "${{ secrets.BOT_EMAIL }}" ] || [ -z "${{ secrets.BOT_PASSWORD }}" ]; then
            {
              echo "### The deployment was NOT tried"
              echo ""
              echo "\`BOT_EMAIL\` and \`BOT_PASSWORD\` are not set as repository secrets,"
              echo "so the bot cannot sign in. This is not a result about the product."
              echo ""
              echo "Settings -> Secrets and variables -> Actions. Use a BOT account,"
              echo "never the owner's: the bot deletes what it creates."
              echo ""
              echo "**Vercel is not the place.** Vercel's environment variables are handed"
              echo "to the running deployment, which does not run this job. The deployment"
              echo "needs \`ANTHROPIC_API_KEY\`; this job needs an ACCOUNT to sign in with,"
              echo "and it reads it from a repository secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: try every Make feature on the deployment
        timeout-minutes: 20
        if: steps.which.outputs.is_production == 'true'
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          BOT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # basic.md has one billable check and make.md has three.
          BOT_COST_LIMIT: "4"
        run: node scripts/e2e-bot.mjs checks/basic.md checks/make.md --allow-cost
      # THE REPORT SURVIVES THE RUN. works.md, broken.md and a screenshot
      # per check, kept whether the run passed or failed — a failed run is
      # the one whose report somebody needs.
      - name: the report
        timeout-minutes: 5
        if: always() && steps.which.outputs.is_production == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bot-report
          path: bot-report/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------
  # THE ALERT. Runs only when something above failed.
  alert:
    name: open an issue when CI goes red
    # EVERY job above, not the two I happened to remember. The nightly
    # `prodtests` job was left out of this list when the alert was
    # written, so a red nightly — the only job that runs the full browser
    # suite — would have failed in silence. An alert with a hole in it is
    # the thing it exists to prevent.
    #
    # `prodtests` is skipped on a push (it is schedule/dispatch only) and
    # a skipped dependency does not stop this: `failure()` is true when
    # ANY ancestor failed, and false when they are merely skipped.
    # Enforced by scripts/tests/ci-coverage.test.mjs.
    needs: [verify, prodtest-smoke, prodtests, unmerged-branches, bot-on-deploy, quota-alert]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      # ONE OPEN ISSUE AT A TIME, and this job no longer decides what
      # that means on its own. The red path and the green path below
      # have to agree on the title and on the lookup or they never pair
      # up, so both call the same module and
      # scripts/tests/ci-coverage.test.mjs section 6 runs it.
      - uses: actions/github-script@v7
        timeout-minutes: 5
        with:
          script: |
            const { run } = require('./.github/scripts/ci-red-issue.cjs');
            const result = await run({ github, context, mode: 'red' });
            core.info(JSON.stringify(result));

  # ---------------------------------------------------------------------
  # THE ALL-CLEAR, which did not exist until 2026-10-16 and is the whole
  # reason 33 ci-red issues were open with one of them real.
  #
  # `success()` is true when every job above either passed or was
  # skipped, which is the same reading of a skipped dependency that
  # `failure()` above relies on — the nightly `prodtests` job is skipped
  # on a push and must not hold the all-clear back.
  all-clear:
    name: close the issue when CI goes green
    needs: [verify, prodtest-smoke, prodtests, unmerged-branches, bot-on-deploy, quota-alert]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/github-script@v7
        timeout-minutes: 5
        with:
          script: |
            const { run } = require('./.github/scripts/ci-red-issue.cjs');
            const result = await run({ github, context, mode: 'green' });
            core.info(JSON.stringify(result));
