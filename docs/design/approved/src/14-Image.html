<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Image</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
<style>
.rail{position:absolute;left:24px;top:28px;display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid #222A3D;border-radius:14px;background:#0D1220}
.rb{width:72px;height:56px;border:0;border-radius:10px;background:none;color:#DCE2EE;font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.big{width:376px;height:470px;flex:none;background:#E6E0D8;border-radius:14px}
.strip{display:flex;gap:10px;margin-top:16px}
.tn2{width:64px;height:80px;border-radius:9px;font-size:0}
.tn2.on{outline:2px solid #F5F7FB;outline-offset:2px}
</style></head><body>
<div data-tbar data-tool="Image" data-doc="Κουλούρι σε μαρμάρινο πάγκο"><span class="tag">4 drafts</span><div class="sp"></div><button class="btn" type="button"><i data-i="sendto"></i>Send to…</button><button class="btn pri" type="button">Make final · 4K · 12 credits</button></div>
<div class="stage">
<div class="canvas">
<div class="rail" role="toolbar" aria-label="Tools">
<button class="rb" type="button"><i data-i="brush"></i>Edit area</button>
<button class="rb" type="button"><i data-i="layers"></i>Background</button>
<button class="rb" type="button"><i data-i="expand"></i>Upscale</button>
<button class="rb" type="button"><i data-i="text"></i>Text</button>
<button class="rb" type="button"><i data-i="drop"></i>Brand Kit</button>
</div>
<div class="big sel" data-img="AI photo · variation 2"></div>
<div class="strip">
<div class="tn2" data-img="" style="background:#ECE8E2"></div>
<div class="tn2 on" data-img="" style="background:#E6E0D8"></div>
<div class="tn2" data-img="" style="background:#D9C3A8"></div>
<div class="tn2" data-img="" style="background:#E9E4DD"></div>
</div>
<div data-ask data-sel="Variation 2" data-cost="≈ 1 credit"></div>
</div>
<aside class="insp">
<div class="ig"><span class="lbl">Quality</span><div class="pills"><button class="pill on" type="button">Draft</button><button class="pill" type="button">Normal</button><button class="pill" type="button">High</button><button class="pill" type="button">Max</button></div></div>
<div class="ig"><span class="lbl">Size</span><div class="pills"><button class="pill" type="button">1K</button><button class="pill on" type="button">2K</button><button class="pill" type="button">4K</button><button class="pill" type="button">8K</button></div><span class="sub">8K is made with upscaling</span></div>
<div class="ig"><span class="lbl">Ratio</span><div class="pills"><button class="pill" type="button">1:1</button><button class="pill on" type="button">4:5</button><button class="pill" type="button">9:16</button><button class="pill" type="button">16:9</button><button class="pill" type="button">3:2</button></div></div>
<div class="ig"><span class="lbl">Variations</span><div class="pills"><button class="pill" type="button">1</button><button class="pill" type="button">2</button><button class="pill on" type="button">4</button></div></div>
<div class="ig"><span class="lbl">Style</span><div class="pills"><button class="pill" type="button">AI</button><button class="pill on" type="button">Realistic</button></div></div>
<div class="price"><div><span class="mut">Draft, 4 variations</span><span>1 credit</span></div><div><span class="mut">Final, 4K</span><span>12 credits</span></div><div><span class="mut">You have</span><span>82 credits</span></div></div>
<span class="sub" style="margin-top:-8px">Marked as AI-made inside the file.</span>
</aside>
</div>
<script src="common.js"></script><script>mount()</script>
</body></html>
