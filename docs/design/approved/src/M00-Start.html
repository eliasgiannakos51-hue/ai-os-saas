<style>
body{margin:0;background:#070A12}
*{box-sizing:border-box}

a{color:#DCE2EE;text-decoration:none}

.ph{width:390px;height:844px;display:flex;flex-direction:column;background:#070A12;color:#DCE2EE;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g{fill:none;stroke:#F2A65A;stroke-width:.7;flex:none}
.mt{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px;border-bottom:1px solid #161D2E;flex:none}
.mbn{width:44px;height:44px;border:0;background:none;color:#DCE2EE;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cr{height:32px;padding:0 10px;border:1px solid #222A3D;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#F5F7FB;background:none;margin-right:6px}
.cr .i{width:15px;height:15px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 20px;text-align:center}
.exb{width:100%;min-height:44px;border:0;background:#0D1220;color:#DCE2EE;border-radius:14px;padding:10px 16px;font-size:13.5px;text-align:left}
.field{margin:0 12px 10px;display:flex;flex-direction:column;gap:4px;padding:12px 8px 6px 14px;border:1px solid #222A3D;border-radius:18px;background:#0D1220;flex:none}
.ta{width:100%;height:40px;padding:0;border:0;outline:none;resize:none;background:none;color:#F5F7FB;font:inherit;font-size:15px}
.ta::placeholder{color:#8D96A8}
.frow{display:flex;align-items:center;gap:0;margin-left:-8px}
.opt{height:44px;padding:0 8px;border:0;background:none;color:#DCE2EE;border-radius:8px;font-size:13px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.opt .i{width:13px;height:13px;color:#8D96A8}
.ib{width:44px;height:44px;border:0;background:none;color:#8D96A8;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.send{width:40px;height:40px;margin-left:auto;border:0;border-radius:20px;background:#F5F7FB;color:#070A12;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bn{display:flex;height:64px;border-top:1px solid #161D2E;background:#080B14;flex:none}
.bn a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8D96A8}
.bn a.on{color:#F5F7FB}
