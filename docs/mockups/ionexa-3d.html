/* Layout: a quiet 184px rail on the darkest ground, and ONE floating panel
   beside it that holds the page. Every page is the same pattern: a small
   3D symbol, the title and what it already knows, one pill bar, recents. */
:root{
  --bg:#0f1012; --panel:#16171a; --surface:#1d1e22; --text:#eceef1; --muted:#8a8f98;
  --border:#26282d; --field:#1f2024; --accent:#e6ad5c;
  --on-accent:#1b1406; --hover:rgba(236,238,241,.05); --active:#202125; --faint:rgba(138,143,152,.55);
  --font:"Commissioner","Noto Sans Arabic","Noto Naskh Arabic","Noto Sans SC","PingFang SC","WenQuanYi Zen Hei","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eeece8; --panel:#fdfcfa; --surface:#f2f0ec; --text:#1f1e1c; --muted:#77736b;
  --border:#e2ded6; --field:#ffffff; --accent:#b47724;
  --on-accent:#ffffff; --hover:rgba(31,30,28,.045); --active:#ebe8e2; --faint:rgba(119,115,107,.55);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.app{display:grid;grid-template-columns:184px minmax(0,1fr);height:100%}

/* ---- the rail ---- */
.side{display:flex;flex-direction:column;gap:10px;padding:14px 8px 10px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 4px;background:none;border:0;color:var(--text);font-weight:500;font-size:15px;letter-spacing:.01em}
.brand svg{flex:none}
.earth-m{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(0)}50%{transform:scaleX(-1)}75%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.search{display:flex;align-items:center;gap:8px;margin:0 2px;padding:6px 9px;border-radius:8px;border:0;background:var(--field);color:var(--muted);font-size:13px;text-align:start}
.search span{flex:1}
kbd{font:inherit;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.nav{flex:1;overflow:auto;min-height:0;scrollbar-width:thin;display:flex;flex-direction:column;gap:6px}
.grp h3{margin:0;padding:4px 10px 2px;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.04em}
.grp a{display:block;padding:4px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp a:hover{background:var(--hover);color:var(--text)}
.grp a[aria-current="page"]{background:var(--active);color:var(--text)}
.me{display:flex;align-items:center;gap:9px;padding:8px 8px 2px;border-top:1px solid var(--border)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.me-txt{flex:1;min-width:0;line-height:1.25}
.me-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-cr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* ---- the panel ---- */
.panel{margin:10px;margin-inline-start:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto;min-width:0;position:relative;scrollbar-width:thin}
.topbar{display:none}
#view{min-height:100%;display:flex;flex-direction:column}
.page{flex:1;width:100%;max-width:780px;margin:0 auto;padding:44px 28px 24px;display:flex;flex-direction:column;gap:22px;min-height:100%;box-sizing:border-box}
.view-enter{animation:rise .32s ease-out both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:center;gap:20px}
.head-txt{min-width:0}
h1{margin:0;font-size:22px;font-weight:500;line-height:1.25;letter-spacing:-.005em;text-wrap:balance}
.knows{margin:4px 0 0;color:var(--muted);font-size:14px}
.sym{position:relative;width:130px;height:130px;flex:none}
.sym>svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .4s}
.sym.gl>svg{opacity:0}
.sym:not(.gl)>canvas{opacity:0}
.home .head{flex-direction:column;text-align:center;gap:14px;padding-top:4px}
.home h1{font-size:26px}
.home .sym{width:300px;height:300px;max-width:100%}

/* ---- the one bar ---- */
.bar{display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--border);border-radius:22px;padding:5px;min-height:44px;box-sizing:border-box}
.bar:focus-within{border-color:var(--faint)}
.bar input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:0 6px;height:34px}
.bar input::placeholder{color:var(--muted)}
.bar .icon-btn{width:34px;height:34px}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.pill{border:0;border-radius:14px;padding:4px 10px;background:var(--surface);color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.switch{display:flex;align-items:center;gap:7px;border:0;border-radius:14px;padding:4px 6px 4px 10px;background:var(--surface);color:var(--muted);font-size:12px;flex:none;white-space:nowrap}
.switch i{width:24px;height:14px;border-radius:7px;background:var(--border);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{color:var(--text)}
.switch[aria-checked="true"] i{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.switch[aria-checked="true"] i::after{background:var(--accent);transform:translateX(10px)}
[dir="rtl"] .switch[aria-checked="true"] i::after{transform:translateX(-10px)}
.meta{margin:-12px 0 0;padding-inline-start:16px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{font-weight:500;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:-8px}
.chip{border:1px solid var(--border);background:none;border-radius:16px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--text);background:var(--hover)}

/* ---- recents ---- */
h2{margin:6px 0 -8px;font-size:13px;font-weight:500;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;perspective:900px}
.card{background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform;min-width:0}
.thumb{aspect-ratio:16/10;border-radius:6px;background:var(--panel);position:relative;overflow:hidden;max-width:100%}
.thumb i{position:absolute;inset-inline:10%;height:7%;border-radius:3px;background:var(--border)}
.card-t{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.card-m{font-size:12px;color:var(--muted)}

/* ---- chat ---- */
.thread{display:flex;flex-direction:column;gap:18px}
.q{align-self:flex-end;background:var(--surface);border-radius:14px;padding:8px 13px;max-width:80%}
.a{line-height:1.7;font-size:15px}
.cite{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 3px;margin-inline:2px;border-radius:5px;font-size:10.5px;font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);text-decoration:none;vertical-align:2px}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.src{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:8px 10px;text-decoration:none;color:inherit;min-width:0}
.src b{color:var(--accent);font-weight:500;font-size:12px}
.src span{min-width:0;font-size:13px;line-height:1.35}
.src small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock{position:sticky;bottom:0;margin-top:auto;padding-top:14px;background:linear-gradient(to bottom,transparent,var(--panel) 30%)}

/* ---- finance ---- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border-radius:10px;padding:14px;min-width:0}
.stat-l{font-size:12px;color:var(--muted)}
.stat-v{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.stat-d{font-size:12px;color:var(--muted)}

/* ---- the palette ---- */
.pal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:start center;padding:12vh 16px 0}
.pal-box{width:min(520px,100%);background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:pal .14s ease-out}
@keyframes pal{from{transform:scale(.98);opacity:.001}to{transform:none;opacity:1}}
.pal input{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid var(--border);background:none;padding:13px 16px;font-size:15px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:7px 10px;border-radius:7px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;cursor:pointer}
.pal li[aria-selected="true"]{background:var(--active);color:var(--text)}
.pal li small{color:var(--faint)}

/* ---- the single 3D canvas, and the mock's own controls ---- */
.sym canvas{position:absolute;inset:0;width:100%;height:100%}
.mockbar{position:fixed;inset-block-end:12px;inset-inline-end:14px;z-index:40;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:3px 4px;font-size:11.5px;color:var(--muted)}
.mockbar button{border:0;background:none;border-radius:12px;padding:3px 8px;color:var(--muted)}
.mockbar button[aria-pressed="true"]{background:var(--active);color:var(--text)}
.mockbar output{padding:0 8px;font-variant-numeric:tabular-nums}
.shot .mockbar{display:none}

/* ---- phone ---- */
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:50;inset-block:0;inset-inline-start:0;width:240px;background:var(--bg);transform:translateX(-105%);transition:transform .22s ease-out;box-shadow:0 0 0 100vmax transparent}
  [dir="rtl"] .side{transform:translateX(105%)}
  .drawer-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .panel{margin:6px}
  .topbar{display:flex;align-items:center;gap:8px;padding:8px 8px 0}
  .page{padding:16px 16px 16px;gap:18px}
  .head{gap:14px}
  .sym{width:84px;height:84px}
  .home .sym{width:200px;height:200px}
  .stats{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
  .mockbar{inset-block-end:auto;inset-block-start:10px}
}
@media (prefers-reduced-motion:reduce){
  .earth-m,.view-enter,.pal-box{animation:none}
  .card,.side,.switch i,.switch i::after{transition:none}
}

function toolOf(href){

      '</div></div><div class="dock">'+bar(s.chat.p)+"</div></div>";

    html = '<div class="page view-enter"><div class="head">'+symHTML("bars")+'<div class="head-txt"><h1>'+esc(s.finance.t)+'</h1><p class="knows">'+esc(s.finance.k)+"</p></div></div>"+

      '</div><div class="dock">'+bar(s.finance.p)+"</div></div>";

function renderChrome(){
  var s = S();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==="ar" ? "rtl" : "ltr";
  $("searchLabel").textContent = s.search;
  $("nav").innerHTML = NAV.groups.map(function(g){
    return '<div class="grp"><h3>'+esc(g.labels[state.lang])+"</h3>"+g.items.map(function(it){
      return '<a href="#'+esc(it.href)+'" data-href="'+esc(it.href)+'">'+esc(it.labels[state.lang])+"</a>";
    }).join("")+"</div>";
  }).join("");
  $("avatar").textContent = s.initials;
  $("meName").textContent = s.name;
  $("meCr").textContent = fmt(CREDITS_BALANCE)+" "+s.creditsWord;
  $("menuBtn").setAttribute("aria-label", s.menu);
  $("themeBtn").innerHTML = state.theme==="dark" ? ICON.sun : ICON.moon;
  $("themeBtn").setAttribute("aria-label", state.theme==="dark" ? s.light : s.dark);

}
function markNav(){
  var cur = state.view==="sites" ? "/dashboard/website-builder" : state.view==="chat" ? "/dashboard/chat" : state.view==="finance" ? "/dashboard/finance" : state.view==="generic" ? state.tool : null;
  var links = $("nav").querySelectorAll("a");
  for (var i=0;i<links.length;i++){ if (links[i].dataset.href===cur) links[i].setAttribute("aria-current","page"); else links[i].removeAttribute("aria-current"); }
}
function go(view, tool){
  state.view = view; if (tool) state.tool = tool;
  document.body.classList.remove("drawer-open");
  render();
  $("panel").scrollTop = 0;
}
function openTool(href){
  var v = VIEW_OF[href];
  if (href.indexOf("/dashboard/chat")===0) v = "chat";
  go(v || "generic", v ? null : href);
}

// --- cards tilt in 3D under the pointer; never on touch, never with reduced motion ---
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function tilt(){
  if (reduced) return;
  var list = document.querySelectorAll(".card");
  for (var i=0;i<list.length;i++) (function(c){
    c.onpointermove = function(e){
      if (e.pointerType!=="mouse") return;
      var r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
      c.style.transform = "rotateX("+(-y*8).toFixed(2)+"deg) rotateY("+(x*10).toFixed(2)+"deg) translateZ(4px)";
    };
    c.onpointerleave = function(){ c.style.transform = ""; };
  })(list[i]);
}

// --- theme: dark by default, light on request, remembered ---
function setTheme(t){
  state.theme = t;
  if (t==="light") document.documentElement.setAttribute("data-theme","light"); else document.documentElement.removeAttribute("data-theme");
  store.set("ionexa.theme", t);
  renderChrome(); G3.recolor();
}

// --- the palette ---
function openPalette(){
  var s = S(), items = [];
  NAV.groups.forEach(function(g){ g.items.forEach(function(it){ items.push({href:it.href,label:it.labels[state.lang],group:g.labels[state.lang]}); }); });
  var wrap = document.createElement("div");
  wrap.className = "pal";
  wrap.innerHTML = '<div class="pal-box" role="dialog" aria-modal="true"><input id="palIn" type="text" autocomplete="off" placeholder="'+esc(s.palette)+'" aria-label="'+esc(s.palette)+'"><ul role="listbox" id="palList"></ul></div>';
  document.body.appendChild(wrap);
  var inp = wrap.querySelector("input"), ul = wrap.querySelector("ul"), sel = 0, shown = items;
  function draw(){
    ul.innerHTML = shown.map(function(it,i){return '<li role="option" aria-selected="'+(i===sel)+'" data-href="'+esc(it.href)+'">'+esc(it.label)+"<small>"+esc(it.group)+"</small></li>";}).join("");
  }
  function close(){ wrap.remove(); }
  inp.oninput = function(){ var q = inp.value.toLowerCase(); shown = items.filter(function(it){return it.label.toLowerCase().indexOf(q)>=0;}); sel = 0; draw(); };
  inp.onkeydown = function(e){
    if (e.key==="ArrowDown"){ sel = Math.min(sel+1, shown.length-1); draw(); e.preventDefault(); }
    else if (e.key==="ArrowUp"){ sel = Math.max(sel-1, 0); draw(); e.preventDefault(); }
    else if (e.key==="Enter" && shown[sel]){ close(); openTool(shown[sel].href); }
    else if (e.key==="Escape"){ close(); }
  };
  ul.onclick = function(e){ var li = e.target.closest("li"); if (li){ close(); openTool(li.dataset.href); } };
  wrap.onclick = function(e){ if (e.target===wrap) close(); };
  draw(); inp.focus();
}

// --- the mock's own controls: language, view, and what the 3D layer is doing ---
function renderMockbar(){
  var m = $("mockbar");
  m.innerHTML = ["el","en","ar","zh"].map(function(l){return '<button type="button" data-lang="'+l+'" aria-pressed="'+(state.lang===l)+'">'+l.toUpperCase()+"</button>";}).join("")+'<output id="glinfo"></output>';
  m.onclick = function(e){ var b = e.target.closest("button"); if (b){ state.lang = b.dataset.lang; renderChrome(); render(); } };
}

// ===========================================================================
// THE ONE 3D LAYER. One WebGL renderer for the whole app, and it does not
// run on the page's thread: it lives in a Web Worker on an OffscreenCanvas,
// draws every symbol on screen into one strip per frame, and hands the strip
// back as an ImageBitmap that each slot copies its own square out of. The
// page never parses three.js, so nothing the 3D layer does can stand between
// a keystroke and the field (measured: scripts/mockups-3d.mjs).
//
// Where a browser cannot run WebGL in a worker, the same code runs on the
// page instead, and then it waits until the person is not typing. Where
// there is no WebGL at all, or the device is weak, nothing is loaded and
// every slot keeps the SVG drawing it has shown from the first paint: never
// an empty square, never a wait in the field.
// ===========================================================================
function g3core(env){
  var THREE, O, renderer, canvas, scenes = {}, slots = [], mats = [], raf = 0, last = 0, acked = true, paused = false, dirty = true;
  var frames = 0, fpsT = 0, fps = 0, total = 0, lowSince = 0, mode = "animate";
  var tick = env.raf || function(f){ return setTimeout(function(){ f(performance.now()); }, 16); };
  var untick = env.caf || clearTimeout;
  function mat(kind, op, size){
    var m = kind==="points" ? new THREE.PointsMaterial({color:O.accent, size:size||.03, transparent:true, opacity:op==null?1:op, depthWrite:false})
                            : new THREE.LineBasicMaterial({color:O.accent, transparent:true, opacity:op==null?1:op, depthWrite:false});
    mats.push(m); return m;
  }
  function lines(geo, op){ return new THREE.LineSegments(geo, mat("line", op)); }
  function vec(lat, lon){ var a = lat*Math.PI/180, b = lon*Math.PI/180; return new THREE.Vector3(Math.cos(a)*Math.cos(b), Math.sin(a), Math.cos(a)*Math.sin(b)); }
  function circle(r, n){ var p = []; for (var i=0;i<=n;i++){ var t = i/n*Math.PI*2; p.push(new THREE.Vector3(Math.cos(t)*r, Math.sin(t)*r, 0)); } return new THREE.BufferGeometry().setFromPoints(p); }
  var GLOBE;
  var BUILD = {
    globe: function(){
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, .1, 50); cam.position.z = 4.7;
      var tiltG = new THREE.Group(); tiltG.rotation.x = .38; scene.add(tiltG);
      var spin = new THREE.Group(); tiltG.add(spin);
      var bin = atob(GLOBE.mask), n = GLOBE.n, GOLD = Math.PI*(3-Math.sqrt(5)), pos = [], k = 0, every = O.phone ? 2 : 1;
      for (var i=0;i<n;i++){
        if (!(bin.charCodeAt(i>>3) & (1<<(i&7)))) continue;
        if ((k++ % every)!==0) continue;
        var y = 1-2*(i+.5)/n, r = Math.sqrt(1-y*y), t = i*GOLD;
        pos.push(Math.cos(t)*r, y, Math.sin(t)*r);
      }
      var g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      spin.add(new THREE.Points(g, mat("points", .95, O.phone?.04:.028)));
      scene.add(new THREE.Line(circle(1.0, 96), mat("line", .22)));
      var ATH = [37.98, 23.73];
      var CITIES = [[51.51,-.13],[40.71,-74.0],[25.2,55.27],[1.35,103.82],[30.04,31.24],[-23.55,-46.63],[35.68,139.69],[52.52,13.4]];
      var a0 = vec(ATH[0],ATH[1]), arcs = [];
      CITIES.forEach(function(c, idx){
        var b = vec(c[0],c[1]), ang = a0.angleTo(b), mid = a0.clone().add(b).normalize().multiplyScalar(1+.18+ang*.22);
        var pts = new THREE.QuadraticBezierCurve3(a0, mid, b).getPoints(60);
        var geo = new THREE.BufferGeometry().setFromPoints(pts); geo.setDrawRange(0, 0);
        var line = new THREE.Line(geo, mat("line", .95)); spin.add(line);
        arcs.push({geo:geo, delay:idx*.55});
      });
      var cityPos = []; CITIES.forEach(function(c){ var v = vec(c[0],c[1]); cityPos.push(v.x,v.y,v.z); });
      var cg = new THREE.BufferGeometry(); cg.setAttribute("position", new THREE.Float32BufferAttribute(cityPos, 3));
      spin.add(new THREE.Points(cg, mat("points", 1, .055)));
      var ag = new THREE.BufferGeometry(); ag.setAttribute("position", new THREE.Float32BufferAttribute([a0.x,a0.y,a0.z], 3));
      spin.add(new THREE.Points(ag, mat("points", 1, .09)));
      var orbits = [];
      [[1.32,.5,.0,.35],[1.42,-.35,1.2,-.24],[1.5,.9,2.4,.18]].forEach(function(o){
        var pivot = new THREE.Group(); pivot.rotation.set(o[1], o[2], 0); scene.add(pivot);
        pivot.add(new THREE.Line(circle(o[0], 120), mat("line", .14)));
        var sat = lines(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(.055)), .95); sat.position.x = o[0];
        var arm = new THREE.Group(); arm.add(sat); pivot.add(arm);
        orbits.push({arm:arm, speed:o[3]});
      });
      var y0 = ATH[1]*Math.PI/180 - Math.PI/2;
      spin.rotation.y = -y0;
      return {scene:scene, cam:cam, tick:function(t){
        spin.rotation.y = -y0 + t*.06;
        var cyc = 7.5;
        arcs.forEach(function(a){
          var p = ((t - a.delay) % cyc + cyc) % cyc, grow = Math.min(1, Math.max(0, p/1.4)), fade = p > 5.6 ? Math.max(0, 1-(p-5.6)/1.2) : 1;
          a.geo.setDrawRange(0, Math.round(61*grow*fade));
        });
        orbits.forEach(function(o){ o.arm.rotation.z = t*o.speed*2; });
      }, still:function(){ arcs.forEach(function(a){ a.geo.setDrawRange(0, 61); }); }};
    },
    pages: function(){
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, .1, 50); cam.position.z = 4.4;
      var grp = new THREE.Group(); grp.rotation.set(.28, -.55, 0); scene.add(grp);
      for (var i=0;i<4;i++){
        var p = lines(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.15, 1.5)), i===0 ? 1 : .75-.17*i);
        p.position.set(i*.16, -i*.12, -i*.32); grp.add(p);
      }
      var tl = []; [[.7,.42],[.48,.25],[.6,.08],[.36,-.09]].forEach(function(l){ tl.push(-.42,l[1],0, -.42+l[0],l[1],0); });
      var tg = new THREE.BufferGeometry(); tg.setAttribute("position", new THREE.Float32BufferAttribute(tl, 3));
      grp.add(new THREE.LineSegments(tg, mat("line", .7)));
      return {scene:scene, cam:cam, tick:function(t){ grp.rotation.y = -.55 + Math.sin(t*.6)*.22; grp.rotation.x = .28 + Math.sin(t*.4)*.06; }};
    },
    poly: function(){
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, .1, 50); cam.position.z = 4.2;
      var geo = new THREE.IcosahedronGeometry(1.05, 0), m = lines(new THREE.EdgesGeometry(geo), 1);
      var v = new THREE.Points(geo, mat("points", 1, .07)), inner = lines(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(.55, 0)), .35);
      scene.add(m, v, inner);
      return {scene:scene, cam:cam, tick:function(t){ m.rotation.set(t*.17, t*.3, 0); v.rotation.copy(m.rotation); inner.rotation.set(-t*.2, -t*.25, 0); }};
    },
    bars: function(){
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, .1, 50); cam.position.set(0, .4, 4.6);
      var grp = new THREE.Group(); grp.rotation.x = .45; scene.add(grp);
      var H = [.5,.8,1.25,.65,1.05,1.5,.4,.9,1.2], idx = 0;
      for (var x=-1;x<=1;x++) for (var z=-1;z<=1;z++){
        var h = H[idx++], b = lines(new THREE.EdgesGeometry(new THREE.BoxGeometry(.32, h, .32)), .5+h*.33);
        b.position.set(x*.5, h/2-.6, z*.5); grp.add(b);
      }
      grp.add(lines(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.5, .001, 1.5)), .3).translateY(-.6));
      return {scene:scene, cam:cam, tick:function(t){ grp.rotation.y = t*.25; }};
    },
    rings: function(){
      var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, .1, 50); cam.position.z = 4.2;
      var pivots = [], dots = [];
      [[0,0],[1.05,.4],[-1.05,.4]].forEach(function(r, i){
